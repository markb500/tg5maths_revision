<!DOCTYPE html>
<html lang="en">
<head>
  <title>Solution window — TG5 Maths Part I</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async
    src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/latest.js?config=TeX-MML-AM_CHTML">
  </script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <style>
    :root { --bgcolour: #ffffff; }
    body { margin: 16px; background-color: var(--bgcolour, #ffffff); }
    #a2 {
      color: #9b0000;
      margin: 12px 0 20px 0;
      position: relative;
      z-index: 2;
      clear: both;
    }
    #a2 table {
      border-collapse: collapse;
      margin: 0 1.5rem 0.75rem 0;
    }
    #a2 table td, #a2 table th {
      border: 1px solid #666;
      padding: 3px 10px;
      color: #222;
    }
    .canvas-stack {
      position: relative;
      display: block;
      margin: 0 0 16px 0;
      min-height: 0;
      z-index: 1;
      overflow: hidden;
    }
    .canvas-stack canvas {
      display: block;
      position: absolute;
      left: 0;
      top: 0;
    }
    #myCanvas3 { z-index: 1; }
    #myCanvas3b { z-index: 2; pointer-events: none; }
  </style>
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({ "fast-preview": { disabled: true }, tex2jax: { preview: "none" } });
  </script>
</head>
<body>
  <header>
    <h1 class="h4">Solution window</h1>
  </header>
  <main>
    <div class="canvas-stack" id="canvasStack3">
      <canvas id="myCanvas3" width="0.5" height="0.5" style="border:none" aria-hidden="true"></canvas>
      <canvas id="myCanvas3b" width="0.5" height="0.5" style="border:none" aria-hidden="true"></canvas>
    </div>
    <div id="a2" aria-live="polite" aria-atomic="false"></div>
  </main>
</body>
</html>
