<!DOCTYPE html>
<html lang="en">
<head>
  <title>TG5 Maths Part I Test Designer</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body { padding: 20px; }
    .topic-list { max-height: 420px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; }
    .selected-item {
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
      cursor: grab; user-select: none;
    }
    .selected-item .topic-label { flex: 1 1 auto; }
    .selected-item .item-controls { display: flex; flex-shrink: 0; gap: 0.25rem; }
    .selected-item.dragging { opacity: 0.5; background: #e9ecef; }
    .selected-item.drag-over { border-top: 3px solid #007bff; }
    :focus-visible { outline: 3px solid #005fcc; outline-offset: 2px; }
    #status { min-height: 1.5em; margin-top: 0.75rem; color: #333; }
  </style>
</head>
<body>
  <h1 class="h3">TG5 Maths Part I — Test Designer</h1>
  <p>
    Add topics from the left-hand list. Reorder with <strong>Up</strong> / <strong>Down</strong>,
    <kbd>Alt</kbd>+<kbd>↑</kbd> / <kbd>Alt</kbd>+<kbd>↓</kbd>, or by dragging.
  </p>
  <div class="row">
    <div class="col-md-5">
      <h2 class="h5" id="availableHeading">Available topics</h2>
      <div id="available" class="list-group topic-list" role="list" aria-labelledby="availableHeading">
        <button type="button" class="list-group-item list-group-item-action" data-topic="Non-Calculator Maths">Non-Calculator Maths</button>
        <button type="button" class="list-group-item list-group-item-action" data-topic="Fractions">Fractions</button>
        <button type="button" class="list-group-item list-group-item-action" data-topic="Percentages &amp; Ratios">Percentages &amp; Ratios</button>
        <button type="button" class="list-group-item list-group-item-action" data-topic="Proportionality">Proportionality</button>
        <button type="button" class="list-group-item list-group-item-action" data-topic="HCF/LCM">HCF/LCM</button>
        <button type="button" class="list-group-item list-group-item-action" data-topic="Indices">Indices</button>
        <button type="button" class="list-group-item list-group-item-action" data-topic="Number Form">Number Form</button>
        <button type="button" class="list-group-item list-group-item-action" data-topic="Probability">Probability</button>
      </div>
    </div>
    <div class="col-md-7">
      <h2 class="h5" id="orderHeading">Test order</h2>
      <p class="small text-muted mb-1" id="orderHint">Position 1 is first on the paper.</p>
      <ol id="selected" class="list-group topic-list" aria-labelledby="orderHeading" aria-describedby="orderHint"></ol>
      <div class="mt-3">
        <button type="button" id="clearBtn" class="btn btn-outline-secondary btn-sm">Clear list</button>
        <button type="button" id="createBtn" class="btn btn-primary btn-sm">Create Test</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </div>
  <script>
    const available = document.getElementById('available');
    const selected = document.getElementById('selected');
    const statusEl = document.getElementById('status');
    let testArr = [];
    let dragSrc = null;
    function announce(msg) { statusEl.textContent = msg; }
    function syncTestArr() {
      testArr = Array.from(selected.querySelectorAll('.selected-item')).map((el) => el.dataset.topic);
    }
    function moveItem(item, direction) {
      const items = Array.from(selected.querySelectorAll('.selected-item'));
      const index = items.indexOf(item);
      if (index < 0) return;
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= items.length) {
        announce(direction < 0 ? item.dataset.topic + ' is already first.' : item.dataset.topic + ' is already last.');
        return;
      }
      if (direction < 0) selected.insertBefore(item, items[newIndex]);
      else selected.insertBefore(items[newIndex], item);
      syncTestArr();
      const pos = Array.from(selected.querySelectorAll('.selected-item')).indexOf(item) + 1;
      announce(item.dataset.topic + ' moved to position ' + pos + ' of ' + testArr.length + '.');
      item.querySelector('.topic-label').focus();
    }
    function removeItem(item) {
      const name = item.dataset.topic;
      item.remove();
      syncTestArr();
      announce(name + ' removed. ' + testArr.length + ' topic(s) in the test.');
    }
    function addSelectedItem(topic) {
      const item = document.createElement('li');
      item.className = 'list-group-item selected-item';
      item.draggable = true;
      item.dataset.topic = topic;
      const label = document.createElement('button');
      label.type = 'button';
      label.className = 'btn btn-link topic-label p-0 text-left';
      label.textContent = topic;
      label.setAttribute('aria-label', topic + '. Activate to remove from test order.');
      label.addEventListener('click', (e) => { e.stopPropagation(); removeItem(item); });
      const controls = document.createElement('span');
      controls.className = 'item-controls';
      const upBtn = document.createElement('button');
      upBtn.type = 'button';
      upBtn.className = 'btn btn-sm btn-outline-secondary';
      upBtn.textContent = 'Up';
      upBtn.setAttribute('aria-label', 'Move ' + topic + ' up');
      upBtn.addEventListener('click', (e) => { e.stopPropagation(); moveItem(item, -1); });
      const downBtn = document.createElement('button');
      downBtn.type = 'button';
      downBtn.className = 'btn btn-sm btn-outline-secondary';
      downBtn.textContent = 'Down';
      downBtn.setAttribute('aria-label', 'Move ' + topic + ' down');
      downBtn.addEventListener('click', (e) => { e.stopPropagation(); moveItem(item, 1); });
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'btn btn-sm btn-outline-danger';
      removeBtn.textContent = 'Remove';
      removeBtn.setAttribute('aria-label', 'Remove ' + topic);
      removeBtn.addEventListener('click', (e) => { e.stopPropagation(); removeItem(item); });
      controls.append(upBtn, downBtn, removeBtn);
      item.append(label, controls);
      item.addEventListener('keydown', (e) => {
        if (!e.altKey) return;
        if (e.key === 'ArrowUp') { e.preventDefault(); moveItem(item, -1); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); moveItem(item, 1); }
      });
      item.addEventListener('dragstart', (e) => {
        dragSrc = item; item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', topic);
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        selected.querySelectorAll('.drag-over').forEach((el) => el.classList.remove('drag-over'));
        dragSrc = null; syncTestArr();
      });
      item.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
      item.addEventListener('dragenter', (e) => { e.preventDefault(); if (item !== dragSrc) item.classList.add('drag-over'); });
      item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
      item.addEventListener('drop', (e) => {
        e.preventDefault(); item.classList.remove('drag-over');
        if (dragSrc && dragSrc !== item) {
          const children = Array.from(selected.querySelectorAll('.selected-item'));
          const from = children.indexOf(dragSrc), to = children.indexOf(item);
          if (from < to) selected.insertBefore(dragSrc, item.nextSibling);
          else selected.insertBefore(dragSrc, item);
          syncTestArr();
          announce(dragSrc.dataset.topic + ' reordered by dragging.');
        }
      });
      selected.appendChild(item);
      syncTestArr();
      announce(topic + ' added at position ' + testArr.length + '.');
      upBtn.focus();
    }
    available.querySelectorAll('[data-topic]').forEach((btn) => {
      btn.addEventListener('click', () => addSelectedItem(btn.dataset.topic));
    });
    document.getElementById('clearBtn').addEventListener('click', () => {
      testArr = []; selected.innerHTML = ''; announce('Test order cleared.');
    });
    document.getElementById('createBtn').addEventListener('click', () => {
      syncTestArr();
      if (testArr.length === 0) {
        announce('Please add at least one topic before creating a test.');
        available.querySelector('button')?.focus();
        return;
      }
      sessionStorage.setItem('testArr', JSON.stringify(testArr));
      window.open('index.html?test=1', 'testView');
      window.close();
    });
  </script>
</body>
</html>
